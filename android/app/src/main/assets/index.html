<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Predator Terminal</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0f;
      color: #d1d4dc;
      overflow: hidden;
      height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #12121a;
      border-bottom: 1px solid #1a1a2e;
      height: 56px;
    }

    #symbol-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #connection-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #1a1a2e;
      color: #888;
    }

    #symbol-selector {
      background: #1a1a2e;
      color: #d1d4dc;
      border: 1px solid #2a2a3e;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      min-width: 120px;
      min-height: 44px;
    }

    /* ── Chart Container ── */
    #chart-container {
      width: 100%;
      height: calc(100vh - 56px - 140px - 80px);
      position: relative;
      background: #0a0a0f;
    }

    /* ── HUD ── */
    #predator-hud {
      background: #12121a;
      border-top: 1px solid #1a1a2e;
      padding: 12px 16px;
      height: 140px;
      overflow-y: auto;
    }

    .hud-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .hud-status {
      font-size: 16px;
    }

    .hud-symbol {
      font-weight: 700;
      font-size: 16px;
    }

    .hud-change {
      font-size: 14px;
      font-weight: 600;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .hud-cell {
      background: #1a1a2e;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hud-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-value {
      font-size: 14px;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    /* ── Signal Panel ── */
    #signal-panel {
      background: #12121a;
      border-top: 1px solid #1a1a2e;
      padding: 12px 16px;
      height: 80px;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .signal-card {
      flex-shrink: 0;
      background: #1a1a2e;
      border-radius: 6px;
      padding: 8px 12px;
      min-width: 120px;
      border-left: 3px solid #888;
    }

    .signal-card.signal-buy {
      border-left-color: #00CC66;
    }

    .signal-card.signal-sell {
      border-left-color: #FF4444;
    }

    .signal-dir {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .signal-score {
      font-size: 16px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }

    .signal-conf {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }

    .signal-time {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    /* ── Toast Animation ── */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0f;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2a3e;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3a3a4e;
    }

    /* ── Mobile Optimization ── */
    @media (max-width: 768px) {
      .hud-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      #signal-panel {
        height: 100px;
      }

      .signal-card {
        min-width: 100px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div id="header">
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="symbol-title">BTCUSDT</span>
      <span id="connection-badge">BAĞLANIYOR</span>
    </div>
    <select id="symbol-selector"></select>
  </div>

  <!-- Chart -->
  <div id="chart-container"></div>

  <!-- HUD -->
  <div id="predator-hud">
    <div class="hud-row">
      <span class="hud-status">●</span>
      <span class="hud-symbol">YÜKLENIYOR</span>
    </div>
    <div class="hud-grid">
      <div class="hud-cell">
        <span class="hud-label">VOL</span>
        <span class="hud-value">-</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">SPREAD</span>
        <span class="hud-value">-</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">IMB</span>
        <span class="hud-value">-</span>
      </div>
      <div class="hud-cell">
        <span class="hud-label">DUVAR</span>
        <span class="hud-value">-</span>
      </div>
    </div>
  </div>

  <!-- Signal Panel -->
  <div id="signal-panel"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Main Script -->
  <script src="./predator.js"></script>
</body>
</html>
