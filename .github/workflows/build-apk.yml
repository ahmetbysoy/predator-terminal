name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      working-directory: android
      run: chmod +x gradlew

    - name: Build web bundle
      run: |
        npm install
        npx esbuild src/main.ts --bundle --outfile=predator.js --minify --format=iife --target=es2020
        cp index.html android/app/src/main/assets/
        cp predator.js android/app/src/main/assets/

    - name: Download Gradle Wrapper JAR
      working-directory: android
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      working-directory: android
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: predator-terminal-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: predator-terminal-release
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: predator-terminal-release

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign
      with:
        releaseDirectory: .
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *-signed.apk
          app-release-unsigned.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
