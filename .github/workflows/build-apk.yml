name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Node dependencies
        run: npm install

      - name: Build web bundle
        run: npx esbuild src/main.ts --bundle --outfile=predator.js --minify --format=iife --target=es2020

      - name: Copy web assets to Android
        run: |
          cp index.html android/app/src/main/assets/
          cp predator.js android/app/src/main/assets/
          cp lightweight-charts.standalone.js android/app/src/main/assets/ 2>/dev/null || true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Download Gradle Wrapper JAR
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: predator-terminal-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
